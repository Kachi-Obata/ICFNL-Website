<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="5" fill="#039D03"/>
  <!-- Balance scale (scales of justice) -->
  <!-- Centre pole -->
  <line x1="16" y1="6" x2="16" y2="26" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="11" y1="26" x2="21" y2="26" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Beam -->
  <line x1="6" y1="10" x2="26" y2="10" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left arm -->
  <line x1="6" y1="10" x2="6" y2="17" stroke="white" stroke-width="1" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="26" y1="10" x2="26" y2="17" stroke="white" stroke-width="1" stroke-linecap="round"/>
  <!-- Left pan -->
  <path d="M3.5 17 Q6 22.5 8.5 17" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Right pan -->
  <path d="M23.5 17 Q26 22.5 28.5 17" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
</svg>
